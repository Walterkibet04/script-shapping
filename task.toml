[task]
name = "afterquery/script-shaping"

[metadata]
author_name = "Walter kibet"
author_email = "kibetwalter726@gmail.com"
difficulty_explanation = "This is the job of a type engineer or font developer who has to finish the layout code for a newly drawn script that has no shaping documentation, working only from reference output (proof sheets or a reference build) rather than a spec. The data is synthetic: the script, glyph names, outlines, anchors, advances and all 52 proof lines are invented and generated for this task, the rules are modelled on real joining-script and Indic-style behaviour (joiner and non-joiner controls, a stacker that subjoins the next consonant or fuses two particular pairs into conjunct letters, a leading letter plus stacker that becomes a mark moved past the whole cluster like a reph, a split vowel, a pre-base vowel that moves over a cluster), and the engine is a deliberately simplified shaper, so the problem is a realistic reverse-engineering exercise rather than a copy of a shipping font. Every proof line is a dense run of 17 to 31 input codepoints that mixes all of these rules, and there are no short isolating lines, so each rule has to be separated from the others by comparing lines. Nothing in the glyph names or outlines says which glyphs are the initial, medial or final forms of which letter, which letters have a subjoined form, or which pairs form conjuncts, so the whole form inventory has to be inferred. The rules also interact in ways that are invisible in the output. The reph and conjunct lookups must run before generic subjoining, because otherwise the stacker is consumed first. Ligatures need IgnoreMarks so that intervening marks end up behind the ligature glyph. A reph syllable blocks joining with the preceding letter while an ordinary mark does not. Joining lookups must treat the joiner as a letter and ignore marks, and the joiner glyphs may only be deleted after joining. The reph is placed directly behind the first consonant and ahead of its subjoined marks, and the pre-base vowel and the split vowel's front part then have to move over a cluster that may carry a reph and up to two subjoined marks, which needs one rule per tail length in the right order. A tone typed before a vowel is swapped behind it, and only then does a vowel directly on a tall letter (a set of letters that has to be inferred, conjunct and ligature forms included) take its lowered variant; a vowel that sits behind a reph or a subjoined mark does not. Collision offsets between stacked marks only work if they run after mark attachment, because attachment overwrites the offset. Kerning is defined on classes of letter forms, and the held-out lines contain kerned glyph pairs that never appear in the 40 lines, so a table copied from the proofs fails while a class rule inferred from them passes. The twelve held-out lines are longer than the published ones (26 to 34 codepoints) and were chosen to exercise the rarer combinations of these rules, each of which is shown in the published lines at least once, so a solver cannot pass by fitting only the common patterns. A wrong guess gives a different glyph sequence rather than a small numeric error, and every one of the twelve held-out lines must match exactly. Experts need a day or more; a generalist who does not already know how lookups compose and how mark attachment resolves has very little to start from."
solution_explanation = "The reference file runs these lookups in order. A ligature lookup turns the extra letter plus the stacker into a temporary non-mark glyph, which marks a reph. A second ligature lookup fuses the two conjunct letter pairs, each with the stacker, into conjunct letters that have their own joining forms. A third ligature lookup turns a stacker plus a subjoinable letter into that letter's subjoined mark glyph. Then ligatures for the two letter pairs, with IgnoreMarks. Then contextual single substitutions for initial, medial and final forms, all with IgnoreMarks and with the joiner glyph counted as a joining neighbour, plus one contextual alternate for a final form that follows a ligature. Then the joiner and non-joiner glyphs are deleted. Then a contextual multiple substitution replaces the first consonant after the temporary glyph by itself followed by a reph mark, and the temporary glyph is deleted. Then the typed pre-base vowel is turned into a temporary glyph, a contextual multiple substitution inserts the real vowel in front of the first consonant of the cluster, with four rules for a tail of three, two, one or no reph or subjoined marks, and the temporary glyph is deleted; the split vowel's front part is inserted the same way, and the vowel itself becomes its rear part in a final single substitution. A tone typed before an above-vowel is swapped behind it in three steps: an above-vowel that directly follows a tone becomes a temporary glyph, each tone followed by a temporary glyph is replaced by the real vowel plus itself, and the temporary glyphs are deleted, so every tone and vowel pair swaps on its own even when a ligature gathers several pairs behind it. After that, an above-vowel that directly follows a tall letter, or follows it with one or two subjoined marks in between, is replaced by its lowered variant, one rule per intervening count. In GPOS, class kerning with IgnoreMarks runs first, then mark-to-base attachment to the top and bottom anchors, then a pair lookup that lifts a tone or an above-vowel over a reph, lifts a tone over each above-vowel and lowered above-vowel, and lowers a below-vowel or a second subjoined mark when a subjoined mark precedes it. The key insights are the order of the reph, conjunct and subjoining lookups, IgnoreMarks on ligatures, joining and kerning only, deleting the joiners after joining, the temporary-glyph reorders with one rule per tail length, class-level kerning, and collision after attachment."
verification_explanation = "tests/test.sh compiles the submitted /app/features.fea into a sealed copy of the font with fontTools feaLib 4.62.1, which produces real GSUB and GPOS tables, then applies those tables with the bundled engine to 12 held-out lines and compares glyph name sequences and integer offsets and advances exactly, with no tolerance and no floating point. The reward is 1 only if all 12 match; a compile error, a missing file or an engine error gives 0. The engine reads the compiled tables, not anything the submission claims about them, and the same engine file and the same fontTools version are baked into the environment image and the verifier image. The held-out inputs and expected outputs exist only in tests/. The 40 published lines were chosen by tracing the sealed solution: every single or multiple substitution, ligature, contextual rule, kerning class pair and collision pair that fires on the 12 held-out lines also fires on the published lines (on at least two of them for rules that are common in random text, and on at least one for rare combinations), the letter family, lowered or normal state, reph presence and number of subjoined marks in front of every above-vowel in the held-out lines is shown the same way in the published lines, every adjacent pair of input token classes in the held-out lines occurs in the published lines, and every glyph in a kerned held-out pair is seen on the same side of a kerned pair in the published lines, although at least two kerned glyph pairs in the held-out lines never appear as pairs in the published lines. Lines in which the output does not keep the same number of vowels, tones, marks and reph glyphs as the input were excluded, and so was every line on which the sealed solution disagrees with an independent plain-Python model of the intended behaviour (for example a tone followed by two vowels, where a one-step and a repeated swap are both reasonable readings), so that no accidental or ambiguous behaviour of the sealed solution is tested. The selection was also checked against 51 rival rule sets that a solver could plausibly write instead (joiner deletion at each later position, reph or conjunct lookups in a different order, the alternate final keyed on only one ligature form or on a following mark, lowering with fewer or more intervening marks or across a reph, a tall-letter set with one family removed or added, kerning classes widened to whole letter families, and so on). A rival that disagrees with the sealed solution on any held-out line also disagrees on at least one published line, so no held-out result depends on a choice the 40 lines leave open. Measured on the build machine as published lines out of 40 / held-out lines out of 12: the sealed file scores 40/40 and 12/12; the font with no features scores 0/40 and 0/12; no reph 22/40 and 9/12; no conjunct ligatures 29/40 and 8/12; reph formed after subjoining 28/40 and 10/12; no stacker lookup 2/40 and 0/12; ligatures without IgnoreMarks 36/40 and 10/12; subjoining after ligatures 29/40 and 6/12; joiner not counted in joining 26/40 and 9/12; joiner glyphs not deleted 13/40 and 5/12; no alternate final 38/40 and 11/12; pre-base vowel not moved 11/40 and 4/12; no split vowel front part 12/40 and 7/12; reordering over a bare consonant only 23/40 and 5/12; no tone swap 14/40 and 3/12; no lowered vowel variants 20/40 and 7/12; no stacked-mark collision 5/40 and 0/12; no reph collisions 28/40 and 9/12; no tone collision 12/40 and 4/12; collision before attachment 1/40 and 1/12; kerning without IgnoreMarks 32/40 and 8/12; kerning as a glyph-pair table copied from the proofs 40/40 and 9/12."
category = "Media"
subcategory = "Design"
tags = ["opentype", "font-engineering", "gsub", "gpos", "feature-files", "inference"]
expert_time_estimate_hours = 24
relevant_experience = "Type engineering work on OpenType layout: writing and debugging GSUB and GPOS feature code in .fea for joining scripts and mark-heavy scripts with fontTools and feaLib, working out lookup ordering and mark attachment problems against HarfBuzz output, and building up the layout logic of fonts for scripts with little or no shaping documentation."

